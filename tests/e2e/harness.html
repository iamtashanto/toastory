<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>toastory E2E Harness</title>
    <link rel="stylesheet" href="/dist/themes/ios-glass.toast.css" id="toast-theme" />
    <link rel="stylesheet" href="/dist/themes/ios-glass.dialog.css" id="dialog-theme" />
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        padding: 40px;
        background: #f5f5f7;
        color: #1d1d1f;
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }
      button {
        padding: 10px 18px;
        border-radius: 9999px;
        border: 1px solid #d2d2d7;
        background: #ffffff;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      button:hover {
        background: #e8e8ed;
      }
    </style>
  </head>
  <body>
    <h1>toastory End-to-End Test Harness</h1>
    <p>Testing real browser glass rendering, gestures, focus traps, and hotkeys.</p>

    <div class="buttons">
      <button id="btn-toast" type="button">Show Toast</button>
      <button id="btn-success" type="button">Show Success</button>
      <button id="btn-error" type="button">Show Error</button>
      <button id="btn-action" type="button">Show Action Toast</button>
      <button id="btn-swipe" type="button">Show Swipeable Toast</button>
      <button id="btn-confirm" type="button">Open Confirm</button>
      <button id="btn-prompt" type="button">Open Prompt</button>
      <button id="btn-sheet" type="button">Open Sheet</button>
      <button id="btn-loading" type="button">Open Loading</button>
    </div>

    <script type="module">
      import { ui, toast } from '/dist/index.js';

      window.ui = ui;
      window.toast = toast;
      window.__events = [];

      document.getElementById('btn-toast').addEventListener('click', () => {
        ui.toast('Standard message', { title: 'Welcome' });
      });

      document.getElementById('btn-success').addEventListener('click', () => {
        ui.toast.success('Successfully executed');
      });

      document.getElementById('btn-error').addEventListener('click', () => {
        ui.toast.error('Something went wrong');
      });

      document.getElementById('btn-action').addEventListener('click', () => {
        ui.toast('Email archived', {
          action: {
            label: 'Undo Action',
            onClick: () => {
              window.__events.push('undo_clicked');
            },
          },
        });
      });

      document.getElementById('btn-swipe').addEventListener('click', () => {
        ui.toast('Swipe me away to dismiss', { duration: 0 });
      });

      document.getElementById('btn-confirm').addEventListener('click', async () => {
        const res = await ui.confirm({
          title: 'Confirm Operation',
          text: 'Are you sure you want to proceed?',
          confirmButton: { label: 'Confirm' },
          cancelButton: { label: 'Abort' },
        });
        window.__events.push({ type: 'confirm_result', res });
      });

      document.getElementById('btn-prompt').addEventListener('click', async () => {
        const res = await ui.prompt({
          title: 'Provide Input',
          input: 'text',
          inputValue: 'Default Value',
          confirmButton: { label: 'Submit' },
        });
        window.__events.push({ type: 'prompt_result', res });
      });

      document.getElementById('btn-sheet').addEventListener('click', async () => {
        const res = await ui.sheet({
          title: 'Quick Actions',
          actions: [
            { label: 'Option One', value: 'opt1' },
            { label: 'Option Two', value: 'opt2' },
          ],
        });
        window.__events.push({ type: 'sheet_result', res });
      });

      document.getElementById('btn-loading').addEventListener('click', () => {
        const handle = ui.loading({ title: 'Working...' });
        window.__loadingHandle = handle;
      });

      window.__harnessReady = true;
    </script>
  </body>
</html>
