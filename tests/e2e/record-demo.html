<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>toastory GIF Recording Harness</title>
    <link rel="stylesheet" href="/dist/themes/all.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #090a10;
        color: #f4f4f7;
        font-family:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Segoe UI', Roboto,
          system-ui, sans-serif;
      }
      .ambient-canvas {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 24px 28px;
        background:
          radial-gradient(ellipse 80% 50% at 50% -10%, rgba(59, 130, 246, 0.22), transparent 70%),
          radial-gradient(ellipse 60% 40% at 90% 90%, rgba(168, 85, 247, 0.15), transparent 70%),
          #0b0c14;
      }
      .badge-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.65);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 6px 14px;
        border-radius: 999px;
        width: fit-content;
        backdrop-filter: blur(12px);
      }
      .badge-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 8px #10b981;
      }
      .bottom-hint {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.4);
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="ambient-canvas">
      <div class="badge-row">
        <span class="badge-dot"></span>
        <span id="demo-title">toastory • UI Feedback Toolkit</span>
      </div>
      <div class="bottom-hint">
        <span>Zero dependencies • Apple-style glass • WCAG 2.2 AA</span>
        <span style="font-family: ui-monospace, monospace">npm i toastory</span>
      </div>
    </div>

    <script type="module">
      import { ui, toast } from '/dist/index.js';
      window.ui = ui;
      window.toast = toast;

      window.runToastsDemo = () => {
        document.getElementById('demo-title').textContent =
          'toastory • Interactive Toasts & Promises';
        ui.configure({ theme: 'ios-glass', position: 'top-right', stack: 'stacked' });

        setTimeout(() => {
          toast.success('Changes saved successfully', {
            description: 'All 12 microservices updated in us-east-1.',
            action: { label: 'View Logs' },
            duration: 4000,
          });
        }, 300);

        setTimeout(() => {
          const promise = new Promise((resolve) => setTimeout(resolve, 1800));
          toast.promise(promise, {
            loading: 'Provisioning edge workers...',
            success: 'Workers live across 24 regions (410ms)',
            error: 'Deployment failed',
          });
        }, 1200);

        setTimeout(() => {
          toast.error('Network timeout detected', {
            description: 'Retry attempt 1 of 3 initiated.',
            action: { label: 'Retry Now' },
            duration: 3500,
          });
        }, 2200);
      };

      window.runDialogsDemo = () => {
        document.getElementById('demo-title').textContent = 'toastory • Modal Dialogs & Alerts';
        ui.configure({ theme: 'dialogs' });

        setTimeout(() => {
          const handle = ui.confirm({
            title: 'Delete production cluster?',
            text: 'This will terminate 16 active worker containers immediately.',
            tone: 'danger',
            confirmButton: { label: 'Delete Cluster' },
            cancelButton: { label: 'Cancel' },
          });

          // Simulate user confirming after 1.8s
          setTimeout(async () => {
            const btn = document.querySelector('.gk-confirm');
            if (btn) btn.click();

            setTimeout(() => {
              ui.prompt({
                title: 'Two-Factor Verification',
                text: 'Enter the 6-digit authentication token generated by your app:',
                placeholder: '• • • • • •',
                confirmButton: { label: 'Verify Token' },
                cancelButton: { label: 'Cancel' },
              });
            }, 600);
          }, 1800);
        }, 400);
      };

      window.runSheetsDemo = () => {
        document.getElementById('demo-title').textContent = 'toastory • Action Sheets & Overlays';
        ui.configure({ theme: 'ios-glass' });

        setTimeout(() => {
          const sheet = ui.sheet({
            title: 'Document Options',
            message: 'Choose an action for annual-report-2026.pdf',
            actions: [
              { label: 'Share with Team' },
              { label: 'Export Encrypted PDF' },
              { label: 'Delete Document', style: 'destructive' },
            ],
          });

          // Dismiss and show loading after 2s
          setTimeout(() => {
            const cancelBtn = document.querySelector('.gk-sheet-cancel');
            if (cancelBtn) cancelBtn.click();

            setTimeout(() => {
              const loader = ui.loading({
                text: 'Encrypting and syncing documents...',
                progress: 0.35,
              });

              setTimeout(() => {
                loader.update({ text: 'Almost complete...', progress: 0.85 });
              }, 900);

              setTimeout(() => {
                loader.close();
                toast.success('Sync complete!', { theme: 'ios-glass' });
              }, 1700);
            }, 500);
          }, 2000);
        }, 400);
      };

      window.runThemesDemo = () => {
        document.getElementById('demo-title').textContent = 'toastory • 21 Handcrafted Themes';
        ui.configure({ position: 'top-right', stack: 'stacked' });

        setTimeout(() => {
          toast.success('iOS Glass Specular', {
            theme: 'ios-glass',
            description: 'Translucent Apple-style frosted blur & pill action.',
            action: { label: 'Open' },
            duration: 4000,
          });
        }, 300);

        setTimeout(() => {
          toast.info('Aurora Gradient Glow', {
            theme: 'aurora',
            description: 'Vibrant chromatic ambient animated boundary.',
            action: { label: 'Explore' },
            duration: 4000,
          });
        }, 1100);

        setTimeout(() => {
          toast.warning('Neo-Brutal Hard Shadow', {
            theme: 'brutal',
            description: 'Monospace typography with solid 3px black offset shadow.',
            action: { label: 'Confirm' },
            duration: 4000,
          });
        }, 1900);

        setTimeout(() => {
          toast.error('Liquid Glass Deep Blur', {
            theme: 'liquid-glass',
            description: 'Deep 32px blur with 200% saturation boost.',
            action: { label: 'Dismiss' },
            duration: 4000,
          });
        }, 2700);
      };
    </script>
  </body>
</html>
