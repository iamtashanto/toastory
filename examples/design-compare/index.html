<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>glazekit — Design Comparison & Diff Verification</title>
    <link rel="stylesheet" href="/dist/themes/_base.css" />
    <link rel="stylesheet" href="/dist/themes/essentials.css" />
    <link rel="stylesheet" href="/dist/themes/showcase.css" />
    <link rel="stylesheet" href="/dist/themes/ios-glass.css" />
    <link rel="stylesheet" href="/dist/themes/liquid-glass.css" />
    <link rel="stylesheet" href="/dist/themes/dialogs.css" />
    <style>
      :root {
        --bg: #0c0d0f;
        --fg: #f4f4f6;
        --mut: #9b9ba4;
        --card: #151619;
        --bd: #26272c;
        --accent: #38bdf8;
        color-scheme: dark;
      }
      :root[data-theme='light'] {
        --bg: #f5f5f7;
        --fg: #1d1d1f;
        --mut: #6e6e73;
        --card: #ffffff;
        --bd: #e2e2e5;
        --accent: #0284c7;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 1400px;
        margin: 0 auto;
        padding: 32px 24px 80px;
      }
      header {
        margin-bottom: 24px;
      }
      h1 {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 6px;
      }
      .sub {
        color: var(--mut);
        margin: 0 0 20px;
        font-size: 14.5px;
      }
      .controls-bar {
        position: sticky;
        top: 16px;
        z-index: 1000;
        background: rgba(21, 22, 25, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--bd);
        border-radius: 16px;
        padding: 12px 18px;
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 32px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      :root[data-theme='light'] .controls-bar {
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }
      .ctrl-group {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13.5px;
      }
      .ctrl-group label {
        color: var(--mut);
        font-weight: 500;
      }
      button,
      select {
        font: inherit;
        font-size: 13px;
        padding: 7px 12px;
        border-radius: 9px;
        border: 1px solid var(--bd);
        background: var(--card);
        color: var(--fg);
        cursor: pointer;
        transition:
          opacity 0.15s,
          border-color 0.15s;
      }
      button:hover {
        border-color: var(--accent);
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
        border-color: transparent;
        font-weight: 600;
      }
      .slider-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      input[type='range'] {
        width: 140px;
        accent-color: var(--accent);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 640px), 1fr));
        gap: 24px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 20px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .card-header {
        padding: 14px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--bd);
      }
      .card-title {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .card-title h3 {
        margin: 0;
        font-size: 14.5px;
        font-weight: 600;
      }
      .tag {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 2px 7px;
        border-radius: 6px;
        background: var(--bd);
        color: var(--mut);
      }
      .card-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .split-stage {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 220px;
        position: relative;
        overflow: hidden;
      }
      .split-pane {
        padding: 24px 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .split-pane::before {
        content: attr(data-label);
        position: absolute;
        top: 10px;
        left: 12px;
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        opacity: 0.55;
      }
      .split-pane:first-child {
        border-right: 1px dashed rgba(255, 255, 255, 0.15);
      }
      :root[data-theme='light'] .split-pane:first-child {
        border-right-color: rgba(0, 0, 0, 0.12);
      }
      /* Diff Overlay Mode */
      .overlay-stage {
        position: relative;
        min-height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
      }
      .layer-ref {
        position: absolute;
        pointer-events: none;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .layer-live {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .split-pane .gk-toast,
      .layer-live .gk-toast,
      .layer-ref .gk-toast {
        position: relative;
      }
      /* Background Presets */
      .bg-aurora {
        background: linear-gradient(135deg, #4f46e5, #c026d3 55%, #f97316) !important;
      }
      .bg-ocean {
        background: linear-gradient(135deg, #0f172a, #0e7490) !important;
      }
      .bg-sunset {
        background:
          radial-gradient(circle at 25% 20%, #ffb86b 0, transparent 45%),
          radial-gradient(circle at 80% 85%, #ff6b9a 0, transparent 50%), #3b2a5e !important;
      }
      .bg-mesh {
        background:
          radial-gradient(circle at 15% 20%, #ff7a59 0, transparent 45%),
          radial-gradient(circle at 85% 30%, #7c5cff 0, transparent 50%),
          radial-gradient(circle at 50% 100%, #19c3b1 0, transparent 55%), #2a2f6b !important;
      }
      .bg-dark {
        background: #0b0b0f !important;
      }
      .bg-light {
        background: #f0eee9 !important;
      }
      /* Animation keyframes */
      @keyframes gk-enter-test {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .play {
        animation: gk-enter-test 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .pill {
        border-radius: 9999px !important;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>glazekit — Visual Comparison & Pixelmatch Diff</h1>
        <p class="sub">
          Interactive verification gallery comparing approved design specifications with live
          glazekit renders. Inspect paddings, border radiuses, shadows, blur depth, typography and
          contrast.
        </p>
      </header>

      <div class="controls-bar">
        <div class="ctrl-group">
          <label for="sel-group">Theme Group:</label>
          <select id="sel-group">
            <option value="all">All Groups (48 designs)</option>
            <option value="showcase">Showcase (12)</option>
            <option value="ios">iOS Glass (12)</option>
            <option value="essentials">Essentials (12)</option>
            <option value="dialogs">Dialogs (12)</option>
          </select>
        </div>

        <div class="ctrl-group">
          <label for="sel-view">View Mode:</label>
          <select id="sel-view">
            <option value="split">Side-by-Side Split</option>
            <option value="overlay">Diff Overlay Blend</option>
          </select>
        </div>

        <div class="ctrl-group slider-wrap" id="wrap-slider" style="display: none">
          <label for="rng-blend">Diff Blend (0% Glazekit → 100% Ref):</label>
          <input type="range" id="rng-blend" min="0" max="100" value="50" />
          <span id="txt-blend" style="min-width: 38px; font-variant-numeric: tabular-nums"
            >50%</span
          >
        </div>

        <div class="ctrl-group">
          <label for="sel-bg">Background:</label>
          <select id="sel-bg">
            <option value="bg-dark">Plain Dark (#0b0b0f)</option>
            <option value="bg-light">Plain Light (#f0eee9)</option>
            <option value="bg-aurora">Aurora Gradient</option>
            <option value="bg-ocean">Ocean Deep</option>
            <option value="bg-sunset">Sunset Glow</option>
            <option value="bg-mesh">Multicolor Mesh</option>
          </select>
        </div>

        <div class="ctrl-group">
          <button type="button" id="btn-theme">🌓 Toggle Dark/Light</button>
          <button type="button" class="btn-primary" id="btn-replay-all">↺ Replay All</button>
        </div>
      </div>

      <div class="grid" id="main-grid"></div>
    </div>

      const grid = document.getElementById('main-grid');
      let currentMode = 'split';
      let currentBlend = 0.5;
      let currentBg = 'bg-dark';
      let currentGroup = 'all';

      function renderCards() {
        grid.innerHTML = '';
        const filtered = DESIGNS.filter((d) => currentGroup === 'all' || d.group === currentGroup);

        for (const item of filtered) {
          const card = document.createElement('div');
          card.className = 'card';
          card.dataset.id = item.id;
          card.dataset.group = item.group;

          card.innerHTML = `
            <div class="card-header">
              <div class="card-title">
                <span class="tag">${item.group}</span>
                <h3>#${item.num} ${item.name}</h3>
              </div>
              <div class="card-actions">
                <span class="tag" style="opacity:0.75">${item.variant}</span>
                <button type="button" class="btn-rp">↺ Replay</button>
              </div>
            </div>
            ${
              currentMode === 'split'
                ? `
              <div class="split-stage ${currentBg}">
                <div class="split-pane" data-label="Design Ref (HTML/CSS)">
                  ${item.htmlRef}
                </div>
                <div class="split-pane" data-label="glazekit (Live)">
                  ${item.htmlLive}
                </div>
              </div>
            `
                : `
              <div class="overlay-stage ${currentBg}">
                <div class="layer-live">
                  ${item.htmlLive}
                </div>
                <div class="layer-ref" style="opacity: ${currentBlend}">
                  ${item.htmlRef}
                </div>
              </div>
            `
            }
          `;

          const rpBtn = card.querySelector('.btn-rp');
          rpBtn.addEventListener('click', () => {
            const playEl = card.querySelector('.play');
            if (playEl) {
              playEl.classList.remove('play');
              void playEl.offsetWidth;
              playEl.classList.add('play');
            }
          });

          grid.append(card);
        }
      }

      // Event Listeners
      document.getElementById('sel-view').addEventListener('change', (e) => {
        currentMode = e.target.value;
        document.getElementById('wrap-slider').style.display =
          currentMode === 'overlay' ? 'flex' : 'none';
        renderCards();
      });

      const blendInput = document.getElementById('rng-blend');
      const blendText = document.getElementById('txt-blend');
      blendInput.addEventListener('input', (e) => {
        const val = Number(e.target.value);
        currentBlend = val / 100;
        blendText.textContent = `${val}%`;
        document.querySelectorAll('.layer-ref').forEach((el) => {
          el.style.opacity = currentBlend;
        });
      });

      document.getElementById('sel-bg').addEventListener('change', (e) => {
        currentBg = e.target.value;
        document.querySelectorAll('.split-stage, .overlay-stage').forEach((st) => {
          st.className = `${currentMode === 'split' ? 'split-stage' : 'overlay-stage'} ${currentBg}`;
        });
      });

      document.getElementById('sel-group').addEventListener('change', (e) => {
        currentGroup = e.target.value;
        renderCards();
      });

      document.getElementById('btn-theme').addEventListener('click', () => {
        const root = document.documentElement;
        const isDark = root.getAttribute('data-theme') !== 'light';
        root.setAttribute('data-theme', isDark ? 'light' : 'dark');
      });

      document.getElementById('btn-replay-all').addEventListener('click', () => {
        document.querySelectorAll('.play').forEach((el) => {
          el.classList.remove('play');
          void el.offsetWidth;
          el.classList.add('play');
        });
      });

      // Initial render
      renderCards();
    </script>
