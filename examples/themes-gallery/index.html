<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>glazekit — Themes & Variants Gallery</title>
    <link rel="stylesheet" href="/dist/themes/_base.css" />
    <link rel="stylesheet" href="/dist/themes/essentials.css" />
    <link rel="stylesheet" href="/dist/themes/showcase.css" />
    <link rel="stylesheet" href="/dist/themes/ios-glass.css" />
    <link rel="stylesheet" href="/dist/themes/liquid-glass.css" />
    <link rel="stylesheet" href="/dist/themes/dialogs.css" />
    <style>
      :root {
        --bg: #f4f4f2;
        --fg: #17171a;
        --mut: #6b6b73;
        --card: #ffffff;
        --bd: #e4e4e0;
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        --bg: #0d0d0f;
        --fg: #f4f4f5;
        --mut: #9a9aa3;
        --card: #17171a;
        --bd: #2a2a30;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.5;
      }
      .wrap {
        max-width: 1120px;
        margin: 0 auto;
        padding: 32px 20px 64px;
      }
      header {
        margin-bottom: 24px;
      }
      h1 {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 6px;
      }
      .sub {
        color: var(--mut);
        margin: 0 0 20px;
        font-size: 15px;
      }
      .top-bar {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 28px;
      }
      button,
      select {
        font: inherit;
        font-size: 13.5px;
        padding: 8px 14px;
        border-radius: 10px;
        border: 1px solid var(--bd);
        background: var(--card);
        color: var(--fg);
        cursor: pointer;
        transition: opacity 0.15s;
      }
      button:hover {
        opacity: 0.88;
      }
      .section-title {
        font-size: 20px;
        font-weight: 600;
        margin: 36px 0 16px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .badge {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 99px;
        background: var(--bd);
        color: var(--mut);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr));
        gap: 20px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 18px;
        padding: 12px 12px 16px;
      }
      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 2px 6px 12px;
      }
      .card-header h3 {
        font-size: 14px;
        font-weight: 600;
        color: var(--fg);
        margin: 0;
      }
      .rp {
        padding: 4px 10px;
        font-size: 12px;
        border-radius: 8px;
      }
      .stage {
        border-radius: 14px;
        min-height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 18px;
        position: relative;
        overflow: hidden;
        cursor: pointer;
        background: #0b0b0f;
        transition: background 0.3s;
      }
      /* Stage background themes */
      .bg-aurora {
        background: linear-gradient(135deg, #4f46e5, #c026d3 55%, #f97316) !important;
      }
      .bg-ocean {
        background: linear-gradient(135deg, #0f172a, #0e7490) !important;
      }
      .bg-sunset {
        background:
          radial-gradient(circle at 25% 20%, #ffb86b 0, transparent 45%),
          radial-gradient(circle at 80% 85%, #ff6b9a 0, transparent 50%), #3b2a5e !important;
      }
      .bg-mesh {
        background:
          radial-gradient(circle at 15% 20%, #ff7a59 0, transparent 45%),
          radial-gradient(circle at 85% 30%, #7c5cff 0, transparent 50%),
          radial-gradient(circle at 50% 100%, #19c3b1 0, transparent 55%), #2a2f6b !important;
      }
      .bg-dark {
        background: #0b0b0f !important;
      }
      .bg-light {
        background: #eceae4 !important;
      }

      /* Animation trigger */
      .play {
        animation: gk-demo-in 0.55s cubic-bezier(0.2, 0.9, 0.25, 1.15) both;
      }
      @keyframes gk-demo-in {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.94);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* Stacking demos hover expansion */
      .stack-box {
        position: relative;
        width: 100%;
        max-width: 380px;
        height: 92px;
        transition: height 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
        display: flex;
        align-items: flex-end;
      }
      .stack-box .gk-toast {
        position: absolute;
        left: 0;
        right: 0;
        transition:
          transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1),
          opacity 0.35s;
      }
      .stack-box .gk-toast:nth-child(3) {
        bottom: 0;
        transform: scale(0.88);
        opacity: 0.55;
        z-index: 1;
      }
      .stack-box .gk-toast:nth-child(2) {
        bottom: 0;
        transform: translateY(-10px) scale(0.94);
        opacity: 0.8;
        z-index: 2;
      }
      .stack-box .gk-toast:nth-child(1) {
        bottom: 0;
        transform: translateY(-20px);
        z-index: 3;
      }
      .stack-box:hover,
      .stack-box:focus-within {
        height: 210px;
      }
      .stack-box:hover .gk-toast:nth-child(3),
      .stack-box:focus-within .gk-toast:nth-child(3) {
        transform: translateY(0);
        opacity: 1;
      }
      .stack-box:hover .gk-toast:nth-child(2),
      .stack-box:focus-within .gk-toast:nth-child(2) {
        transform: translateY(-62px) scale(1);
        opacity: 1;
      }
      .stack-box:hover .gk-toast:nth-child(1),
      .stack-box:focus-within .gk-toast:nth-child(1) {
        transform: translateY(-124px);
      }

      /* Grouped stack demo hover expansion */
      .group-box {
        position: relative;
        width: 100%;
        max-width: 380px;
        height: 150px;
        transition: height 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
      }
      .group-box .gk-toast {
        position: absolute;
        left: 0;
        right: 0;
        transition:
          transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1),
          opacity 0.3s;
      }
      .group-box .gk-toast:nth-child(1) {
        top: 0;
        z-index: 3;
      }
      .group-box .gk-toast:nth-child(2) {
        top: 0;
        transform: translateY(10px) scale(0.95);
        opacity: 0.8;
        z-index: 2;
      }
      .group-box .gk-toast:nth-child(3) {
        top: 0;
        transform: translateY(20px) scale(0.9);
        opacity: 0.55;
        z-index: 1;
      }
      .group-box:hover,
      .group-box:focus-within {
        height: 210px;
      }
      .group-box:hover .gk-toast:nth-child(2),
      .group-box:focus-within .gk-toast:nth-child(2) {
        transform: translateY(68px) scale(1);
        opacity: 1;
      }
      .group-box:hover .gk-toast:nth-child(3),
      .group-box:focus-within .gk-toast:nth-child(3) {
        transform: translateY(136px) scale(1);
        opacity: 1;
      }
    </style>
  </head>

      <header>
        <h1>glazekit Themes & Variants Gallery</h1>

              <option value="bg-mesh">Rainbow Mesh</option>

      <div class="section-title">
        <span>Theme: Showcase</span>
        <span class="badge">12 variants</span>
      </div>

      </div>

        <span class="badge">12 variants</span>

        <span>Dialogs & Bottom Sheets</span>

      function renderGrid(containerId, items) {
        const container = document.getElementById(containerId);
        for (const item of items) {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
      <div class="card-header">
        <h3>${item.num}. ${item.name}</h3>
        <button type="button" class="rp">Replay</button>
      </div>
      <div class="stage ${item.bg}">${item.html}</div>
    `;
          const stage = card.querySelector('.stage');
          const replayBtn = card.querySelector('.rp');
          const replay = () => {
            const el = stage.querySelector('.play');
            if (el) {
              el.classList.remove('play');
              void el.offsetWidth;
              el.classList.add('play');
            }
          };
          stage.addEventListener('click', replay);
          replayBtn.addEventListener('click', replay);

          // Interactive type to confirm
          const tc = stage.querySelector('.in-tc');
          const tcb = stage.querySelector('.btn-tcb');
          if (tc && tcb) {
            tc.addEventListener('input', () => {
              tcb.disabled = tc.value.trim() !== 'acme-website';
            });
          }

          container.append(card);
        }
      }

      renderGrid('grid-showcase', showcaseItems);
      renderGrid('grid-ios', iosItems);
      renderGrid('grid-essentials', essentialsItems);
      renderGrid('grid-dialogs', dialogsItems);

      // Global controls
      document.getElementById('btn-replay-all').addEventListener('click', () => {
        document.querySelectorAll('.stage .play').forEach((el) => {
          el.classList.remove('play');
          void el.offsetWidth;
          el.classList.add('play');
        });
      });

      document.getElementById('btn-theme').addEventListener('click', () => {
        const r = document.documentElement;
        const isDark = r.getAttribute('data-theme') === 'dark';
        r.setAttribute('data-theme', isDark ? 'light' : 'dark');
      });

      document.getElementById('sel-bg').addEventListener('change', (e) => {
        const chosen = e.target.value;
        document.querySelectorAll('.stage').forEach((st) => {
          st.className = `stage ${chosen}`;
        });
      });

      // Live session countdown demo
      let count = 60;
      setInterval(() => {
        count = count <= 0 ? 60 : count - 1;
        document.querySelectorAll('.cd-num').forEach((el) => {
          el.textContent = count;
        });
        document.querySelectorAll('.gk-countdown-fill').forEach((el) => {
          el.style.width = `${(count / 60) * 100}%`;
        });
      }, 1000);
